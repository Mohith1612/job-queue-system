# FastAPI service. Runs alembic migrations on start (same as the
# Dockerfile CMD), then serves on :8000. A NodePort Service exposes
# it on the host at :30080 (mapped via kind-config.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: jobqueue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: jobqueue-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: jobqueue-config
            - secretRef:
                name: jobqueue-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: jobqueue
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
