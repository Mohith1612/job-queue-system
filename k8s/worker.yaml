# Worker that pulls jobs from Redis and runs them. No Service is
# needed because nothing in the cluster connects *to* the worker -
# it only makes outbound connections to Redis and Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: jobqueue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: jobqueue-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jobqueue-config
            - secretRef:
                name: jobqueue-secret
